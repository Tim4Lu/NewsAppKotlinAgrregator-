name: Android CI & Auto Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Restore Keystore using Python
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        python3 -c '
        import os, base64, re

        data = os.environ.get("KEYSTORE_BASE64", "")
        if data:
            # Залишаємо тільки валідні символи Base64
            cleaned = re.sub(r"[^A-Za-z0-9+/=]", "", data)
            
            # Додаємо відсутній падинг "=" до кратності 4
            missing_padding = len(cleaned) % 4
            if missing_padding:
                cleaned += "=" * (4 - missing_padding)
            
            with open("app/newsapp-key.keystore", "wb") as f:
                f.write(base64.b64decode(cleaned))
            print("Keystore successfully restored!")
        '

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        body: |
          Автоматична збірка додатка News Aggregator.
          Версія: 1.0.${{ github.run_number }}
        files: app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
